# SwiftLint configuration for tamga-swift.
#
# Ran in CI as `swiftlint lint --strict` (.github/workflows/ci.yml) -- any
# warning fails the build under --strict, so keep `disabled_rules` deliberate
# and documented, not a dumping ground.

included:
  - Sources
  - Tests

excluded:
  - .build
  - Examples

# Default severity for opt-in rules we enable below.
analyzer_rules:
  - unused_import
  - unused_declaration

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - fatal_error_message
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - overridden_super_call
  - private_outlet
  - redundant_nil_coalescing
  - sorted_imports
  - unneeded_parentheses_in_closure_argument
  - unused_import

disabled_rules:
  # This is a stub-heavy scaffold right now (doc-comment-only files with
  # empty enum bodies) -- todo/fixme markers are expected in the plan's
  # remaining sections and should not fail lint until real implementation
  # work replaces them.
  - todo

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 400
  error: 800

identifier_name:
  min_length: 2
  excluded:
    - id
    - to
    - ip

reporter: "xcode"
