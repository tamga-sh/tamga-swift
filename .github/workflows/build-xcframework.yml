name: Build XCFramework

# Step 1 of the two-step release flow (see release.yml and CLAUDE.md's
# "Release process" section for the full chicken-and-egg explanation).
#
# Triggered on tag push once release-please (release.yml) has cut a tag.
# Builds tamga-c's native artifacts for every platform target, assembles
# them into a single XCFramework, zips it, computes the SPM-compatible
# checksum, and uploads the zip to the GitHub Release that the tag created.
#
# This job intentionally does NOT touch Package.swift -- that happens in
# release.yml's post-release bot-commit job, which runs after this workflow
# finishes (triggered by `workflow_run`) and reads the checksum/asset-url
# artifact this job uploads (see the "Write release info" step below --
# `workflow_run`-triggered jobs cannot read another workflow's job
# `outputs:` directly, only artifacts fetched via `run-id:`).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  # Delegates to tamga-c's own reusable cross-compile matrix rather than
  # duplicating it -- see that workflow's "REUSE POINT" comment. Artifacts
  # it uploads are downloadable by the job below via actions/download-artifact
  # since both jobs belong to this same overall workflow run.
  build-native:
    name: Build tamga-c native artifacts
    # Pinned to tamga-c's latest tagged release, not @main -- tamga-c's own ABI-freeze commitment
    # (struct layout/function signature changes require a version bump) is meaningless if this
    # caller floats on unreleased main; bump this tag deliberately when tamga-c cuts a new release
    # this repo should pick up, not implicitly on every tamga-c push.
    uses: tamga-sh/tamga-c/.github/workflows/build-native.yml@v1.0.1

  build-xcframework:
    name: Build & publish TamgaCore.xcframework
    needs: build-native
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.1"

      # include/tamga.h isn't part of tamga-c's build-native.yml artifacts
      # (that workflow only uploads compiled libraries) -- fetch it
      # directly from tamga-c's source at the same ref this repo's
      # CTamgaShim/module.modulemap expects to re-export.
      - name: Checkout tamga-c (for include/tamga.h)
        uses: actions/checkout@v4
        with:
          repository: tamga-sh/tamga-c
          path: tamga-c-src
          sparse-checkout: |
            include

      - name: Download all tamga-c build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble XCFramework
        run: |
          set -eu

          mkdir -p build/slices/macos-universal build/slices/ios-simulator-universal

          # macOS: one universal static lib covering Intel + Apple Silicon.
          # An XCFramework takes exactly one library per platform+variant
          # slice, so the two per-arch outputs from build-native.yml's
          # matrix must be merged with lipo before xcodebuild ever sees them.
          lipo -create \
            dist/tamga-c-macos-x86_64/libtamga.a \
            dist/tamga-c-macos-aarch64/libtamga.a \
            -output build/slices/macos-universal/libtamga.a

          # iOS Simulator: same reasoning -- one universal slice covering
          # both an Apple Silicon dev machine's arm64 simulator and an
          # Intel dev machine's x86_64 simulator.
          lipo -create \
            dist/tamga-c-ios-simulator-arm64/libtamga.a \
            dist/tamga-c-ios-simulator-x86_64/libtamga.a \
            -output build/slices/ios-simulator-universal/libtamga.a

          # iOS device (arm64) has only one real target today and needs no
          # lipo step -- used directly from build-native.yml's output.

          xcodebuild -create-xcframework \
            -library build/slices/macos-universal/libtamga.a -headers tamga-c-src/include \
            -library dist/tamga-c-ios-arm64/libtamga.a -headers tamga-c-src/include \
            -library build/slices/ios-simulator-universal/libtamga.a -headers tamga-c-src/include \
            -output build/TamgaCore.xcframework

      - name: Zip XCFramework
        run: |
          set -eu
          cd build
          zip -r TamgaCore.xcframework.zip TamgaCore.xcframework

      - name: Compute SPM checksum
        id: checksum
        run: |
          set -eu
          CHECKSUM=$(swift package compute-checksum build/TamgaCore.xcframework.zip)
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/TamgaCore.xcframework.zip

      # release.yml's update-package-manifest job runs in a SEPARATE
      # workflow_run-triggered context and cannot read this job's own
      # `outputs:` directly (workflow_run does not expose the triggering
      # workflow's job outputs) -- hand the two values off via an artifact
      # instead, which actions/download-artifact@v4's `run-id:` input can
      # fetch from that other context.
      - name: Write release info for release.yml to pick up
        run: |
          set -eu
          mkdir -p info
          printf '%s' "${{ steps.checksum.outputs.checksum }}" > info/checksum.txt
          printf '%s' "https://github.com/tamga-sh/tamga-swift/releases/download/${{ github.ref_name }}/TamgaCore.xcframework.zip" > info/asset_url.txt

      - name: Upload release info artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcframework-release-info
          path: info/
