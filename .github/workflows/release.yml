name: Release

# release-please watches conventional-commit messages on `main` and
# maintains a standing "Release PR" that accumulates CHANGELOG.md entries
# and bumps version metadata. Merging that PR cuts a tag + GitHub Release.
#
# That's the entire release surface. Unlike npm/PyPI/crates.io, SPM has no
# central package registry requirement -- the git tag itself is the release
# artifact from a consumer's point of view;
# `.package(url: "https://github.com/tamga-sh/tamga-swift", from: "<version>")`
# resolves directly against GitHub's tag list. No packaging/publish step, no
# binary asset to build or checksum.
#
# Until 2026-08-12 this was a two-step flow: a TamgaCore binaryTarget's
# url:/checksum: had to be patched in by a second job after a separate
# workflow built and uploaded an XCFramework asset, because SPM's
# binaryTarget(url:checksum:) can't be computed before the asset it
# describes exists. That whole chicken-and-egg problem no longer applies --
# this package has no binary target, no XCFramework, no FFI boundary
# anymore (see CLAUDE.md's "Crypto Architecture" section).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The default GITHUB_TOKEN cannot be used here. GitHub deliberately
      # refuses to trigger workflows from events authored by GITHUB_TOKEN
      # (loop prevention), so a release PR opened with it never gets a CI
      # run -- and main's branch protection then blocks it forever on
      # required checks that can't ever report. A short-lived GitHub App
      # installation token is a distinct actor, so its PRs do trigger
      # workflows and the required checks actually run.
      - uses: actions/create-github-app-token@v3
        id: app-token
        timeout-minutes: 10
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: simple
