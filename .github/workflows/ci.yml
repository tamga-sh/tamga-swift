name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS target: lint, build, test, and gate on 80% line coverage.
  macos:
    name: macOS (swiftlint + swift test + coverage gate)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # macOS runner images ship Xcode already -- no separate setup action
      # is needed to install it. We still pin the exact version so a runner
      # image bump doesn't silently change which Swift toolchain CI builds
      # against.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.1"

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict

      # Package.swift's committed binaryTarget is a url:/checksum: pointing
      # at THIS repo's own release assets -- which don't exist yet (no
      # tamga-swift release has ever been cut; Swift business logic is
      # still 100% stub, so cutting one now would misleadingly imply a
      # consumable package version exists). Rather than wait on that or
      # loosen anything, build a real XCFramework from tamga-c's own
      # already-real, already-published releases (tamga-c ships
      # independently of this repo) and swap Package.swift to the
      # documented local-dev `path:` override for this CI run only --
      # mirroring exactly what CLAUDE.md's "Local Development" section
      # already tells a human contributor to do, just automated. Never
      # committed; the checkout is fresh next run either way.
      - name: Determine tamga-c's latest release tag
        id: tamga_c_release
        run: |
          set -eu
          TAG=$(gh release list -R tamga-sh/tamga-c --limit 1 --json tagName --jq '.[0].tagName')
          echo "Using tamga-c release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download tamga-c's macOS release artifacts
        run: |
          set -eu
          mkdir -p dist/x86_64 dist/aarch64
          gh release download "${{ steps.tamga_c_release.outputs.tag }}" -R tamga-sh/tamga-c \
            -p "tamga-c-macos-x86_64.tar.gz" -p "tamga-c-macos-aarch64.tar.gz" -D dist
          tar -xzf dist/tamga-c-macos-x86_64.tar.gz -C dist/x86_64 --strip-components=1
          tar -xzf dist/tamga-c-macos-aarch64.tar.gz -C dist/aarch64 --strip-components=1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assemble a local TamgaCore.xcframework (macOS universal)
        run: |
          set -eu
          mkdir -p build/slice/include
          lipo -create dist/x86_64/libtamga.a dist/aarch64/libtamga.a -output build/slice/libtamga.a
          cp dist/x86_64/tamga.h build/slice/include/tamga.h
          xcodebuild -create-xcframework \
            -library build/slice/libtamga.a -headers build/slice/include \
            -output build/TamgaCore.xcframework

      - name: Point Package.swift at the locally built XCFramework
        run: |
          python3 Scripts/ci-use-local-xcframework.py "build/TamgaCore.xcframework"

      - name: Build & test with coverage
        run: swift test --enable-code-coverage

      - name: Enforce coverage gate
        run: |
          set -eu
          BIN_PATH="$(swift build --show-bin-path)"
          XCTEST_BUNDLE=$(find "$BIN_PATH" -name '*.xctest' -maxdepth 1 | head -n1)
          COV_BIN="${XCTEST_BUNDLE}/Contents/MacOS/$(basename "${XCTEST_BUNDLE}" .xctest)"
          PROFDATA="${BIN_PATH}/codecov/default.profdata"
          xcrun llvm-cov export -summary-only "${COV_BIN}" -instr-profile "${PROFDATA}" \
            | ./Scripts/check-coverage.sh

  # iOS target: build/test-pass check only. Coverage gating lives solely in
  # the macOS job above to avoid double-counting the same test suite run
  # twice against the 80% threshold.
  ios:
    name: iOS Simulator (xcodebuild test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.1"

      # See the macOS job's identical step for the full rationale -- same
      # local-dev-override-automated-in-CI pattern, iOS Simulator slice
      # instead of macOS universal.
      - name: Determine tamga-c's latest release tag
        id: tamga_c_release
        run: |
          set -eu
          TAG=$(gh release list -R tamga-sh/tamga-c --limit 1 --json tagName --jq '.[0].tagName')
          echo "Using tamga-c release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download tamga-c's iOS Simulator release artifacts
        run: |
          set -eu
          mkdir -p dist/arm64 dist/x86_64
          gh release download "${{ steps.tamga_c_release.outputs.tag }}" -R tamga-sh/tamga-c \
            -p "tamga-c-ios-simulator-arm64.tar.gz" -p "tamga-c-ios-simulator-x86_64.tar.gz" -D dist
          tar -xzf dist/tamga-c-ios-simulator-arm64.tar.gz -C dist/arm64 --strip-components=1
          tar -xzf dist/tamga-c-ios-simulator-x86_64.tar.gz -C dist/x86_64 --strip-components=1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assemble a local TamgaCore.xcframework (iOS Simulator universal)
        run: |
          set -eu
          mkdir -p build/slice/include
          lipo -create dist/arm64/libtamga.a dist/x86_64/libtamga.a -output build/slice/libtamga.a
          cp dist/arm64/tamga.h build/slice/include/tamga.h
          xcodebuild -create-xcframework \
            -library build/slice/libtamga.a -headers build/slice/include \
            -output build/TamgaCore.xcframework

      - name: Point Package.swift at the locally built XCFramework
        run: |
          python3 Scripts/ci-use-local-xcframework.py "build/TamgaCore.xcframework"

      - name: Create an iOS Simulator device
        id: sim
        run: |
          set -eu
          # Searching for a pre-existing device -- whether via simctl or
          # via xcodebuild's own -showdestinations -- is not reliable on
          # this runner/Xcode combination (macos-15 + Xcode 16.1 via
          # maxim-lobanov/setup-xcode), confirmed directly across three
          # consecutive CI failures: simctl reported a device (`iPhone 16
          # Pro`) that xcodebuild's own destination resolution didn't
          # recognize at all (not even as "ineligible"); a follow-up run
          # showed xcodebuild had NO concrete device for any platform --
          # iOS, tvOS, watchOS, visionOS -- only the generic "Any ...
          # Simulator Device" placeholders, which `xcodebuild test` cannot
          # run against. GitHub's macOS runner pool is heterogeneous: which
          # simulator devices happen to be pre-provisioned for a given
          # (image, pinned Xcode version) pairing varies per ephemeral
          # runner instance. The only reliable fix is to stop searching for
          # a pre-existing device and create one fresh every run, from
          # whichever iOS Simulator runtime Xcode 16.1 actually has bundled
          # -- every Xcode ships at least one runtime matching its own SDK,
          # unlike device *instances*, which are what varied above.
          RUNTIME_JSON=$(xcrun simctl list runtimes available --json | jq -c '[.runtimes[] | select(.name | startswith("iOS"))][0]')
          echo "iOS runtime: $RUNTIME_JSON"
          if [ "$RUNTIME_JSON" = "null" ]; then
            echo "::error::No available iOS Simulator runtime found under the selected Xcode."
            exit 1
          fi
          RUNTIME_ID=$(echo "$RUNTIME_JSON" | jq -r '.identifier')
          DEVICETYPE_ID=$(echo "$RUNTIME_JSON" | jq -r '[.supportedDeviceTypes[] | select(.name | startswith("iPhone"))][0].identifier')
          echo "Using runtime $RUNTIME_ID with device type $DEVICETYPE_ID"
          DEVICE_ID=$(xcrun simctl create tamga-ci-iphone "$DEVICETYPE_ID" "$RUNTIME_ID")
          echo "Created simulator device: $DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Test on iOS Simulator
        run: |
          # -scheme Tamga (the bare library target) is not configured for
          # the test action -- only the aggregate "<PackageName>-Package"
          # scheme SwiftPM auto-generates includes the test targets.
          # Confirmed directly: `xcodebuild -list` shows three schemes
          # (Tamga, Tamga-Package, TamgaObjC); only Tamga-Package's Test
          # action is populated. Found while fixing the binaryTarget
          # resolution above -- this was always unreachable before.
          #
          # Destination is the simulator device created fresh in the
          # previous step, selected by id (a stable per-instance UUID).
          xcodebuild test \
            -scheme Tamga-Package \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -skipMacroValidation
