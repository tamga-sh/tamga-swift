name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS target: lint, build, test, and gate on 80% line coverage.
  macos:
    name: macOS (swiftlint + swift test + coverage gate)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # macOS runner images ship Xcode already -- no separate setup action
      # is needed to install it. We still pin the exact version so a runner
      # image bump doesn't silently change which Swift toolchain CI builds
      # against.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        timeout-minutes: 10
        with:
          xcode-version: "16.4"

      - name: Install SwiftLint
        timeout-minutes: 10
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict

      - name: Build & test with coverage
        run: swift test --enable-code-coverage

      - name: Enforce coverage gate
        run: |
          set -eu
          BIN_PATH="$(swift build --show-bin-path)"
          XCTEST_BUNDLE=$(find "$BIN_PATH" -name '*.xctest' -maxdepth 1 | head -n1)
          COV_BIN="${XCTEST_BUNDLE}/Contents/MacOS/$(basename "${XCTEST_BUNDLE}" .xctest)"
          PROFDATA="${BIN_PATH}/codecov/default.profdata"
          xcrun llvm-cov export -summary-only "${COV_BIN}" -instr-profile "${PROFDATA}" \
            | ./Scripts/check-coverage.sh

  # iOS target: build/test-pass check only. Coverage gating lives solely in
  # the macOS job above to avoid double-counting the same test suite run
  # twice against the 80% threshold.
  ios:
    name: iOS Simulator (xcodebuild test)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pinned to 16.4, not an earlier version: confirmed directly (see
      # "Create an iOS Simulator device" below) that not every Xcode
      # version's own documented default Simulator SDK is actually
      # installed as a runtime on GitHub's runner images -- 16.4's default
      # (iOS 18.5) is confirmed present on this image's manifest.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        timeout-minutes: 10
        with:
          xcode-version: "16.4"

      - name: Create an iOS Simulator device
        id: sim
        timeout-minutes: 10
        run: |
          set -eu
          # Searching for a pre-existing device is not reliable here --
          # confirmed directly, whether via simctl (found a device
          # xcodebuild's own destination resolution didn't recognize at
          # all) or via xcodebuild's own -showdestinations (found nothing
          # concrete for any platform on some runner instances). GitHub's
          # macOS runner pool is heterogeneous enough that which simulator
          # devices happen to be pre-created varies per ephemeral runner
          # instance. Creating one fresh every run avoids depending on
          # whatever happened to already exist.
          #
          # The runtime to create it from can't be guessed either --
          # confirmed directly that picking whichever available iOS runtime
          # simctl lists first can pick one the selected Xcode can't
          # actually use as a test destination (simctl will happily create
          # a device against it; xcodebuild will just never see it). The
          # authority on "which Simulator SDK does the selected Xcode use"
          # is Xcode itself, via -showsdks. Reading that directly rather
          # than hand-copying a version number keeps this correct across
          # runner image and Xcode updates -- see the "Select Xcode" step
          # above for why the pinned version itself had to change too: the
          # SDK version Xcode reports as its default isn't guaranteed to
          # have a matching runtime actually installed on every runner
          # image, so the version pin and the image's documented installed
          # runtimes have to agree, not just Xcode and -showsdks.
          SDK_VERSION=$(xcodebuild -showsdks -json | jq -r '[.[] | select(.platform == "iphonesimulator")][0].sdkVersion')
          echo "Xcode's paired iOS Simulator SDK version: $SDK_VERSION"
          RUNTIME_JSON=$(xcrun simctl list runtimes available --json | jq -c --arg v "$SDK_VERSION" '[.runtimes[] | select(.version == $v)][0]')
          echo "Matching installed runtime: $RUNTIME_JSON"
          if [ "$RUNTIME_JSON" = "null" ]; then
            echo "::error::No installed iOS Simulator runtime matches Xcode's paired SDK version ($SDK_VERSION)."
            exit 1
          fi
          RUNTIME_ID=$(echo "$RUNTIME_JSON" | jq -r '.identifier')
          DEVICETYPE_ID=$(echo "$RUNTIME_JSON" | jq -r '[.supportedDeviceTypes[] | select(.name | startswith("iPhone"))][0].identifier')
          echo "Using runtime $RUNTIME_ID with device type $DEVICETYPE_ID"
          DEVICE_ID=$(xcrun simctl create tamga-ci-iphone "$DEVICETYPE_ID" "$RUNTIME_ID")
          echo "Created simulator device: $DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Test on iOS Simulator
        run: |
          # -scheme Tamga (the bare library target) is not configured for
          # the test action -- only the aggregate "<PackageName>-Package"
          # scheme SwiftPM auto-generates includes the test targets.
          # Confirmed directly: `xcodebuild -list` shows three schemes
          # (Tamga, Tamga-Package, TamgaObjC); only Tamga-Package's Test
          # action is populated.
          #
          # Destination is the simulator device created fresh in the
          # previous step, selected by id (a stable per-instance UUID).
          xcodebuild test \
            -scheme Tamga-Package \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -skipMacroValidation
